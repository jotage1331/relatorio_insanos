<!DOCTYPE html>
<html lang="pt-BR" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comunicação de Viagem - INSANOS MC</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💀</text></svg>">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Roboto+Condensed:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/pt.js"></script>
    <!-- Custom CSS -->
    <style>
        /* Custom Scrollbar for Webkit */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #121212;
        }

        ::-webkit-scrollbar-thumb {
            background: #4b5320;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #ffd700;
        }

        /* Mobile Optimizations */
        html,
        body {
            overscroll-behavior-y: none;
            /* Prevent pull-to-refresh */
            touch-action: manipulation;
            /* Improve touch response */
        }


        /* Animations */
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        .slide-in-right {
            animation: slideInRight 0.4s ease-out forwards;
        }

        .slide-in-left {
            animation: slideInLeft 0.4s ease-out forwards;
        }

        .fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }

        /* Custom Input Styles to match Rustic/Military theme */
        .rustic-input {
            background-color: #000000;
            border: 2px solid #2e3314;
            color: #ffd700;
            /* Gold text */
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .rustic-input:focus {
            border-color: #ff8c00;
            /* Orange focus */
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.2);
            outline: none;
        }

        /* Texture overlay utility if needed */
        .bg-textured {
            background-image: repeating-linear-gradient(45deg,
                    rgba(0, 0, 0, 0.05),
                    rgba(0, 0, 0, 0.05) 2px,
                    transparent 2px,
                    transparent 4px);
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'mc-green': '#4b5320', // Olive Green
                        'mc-green-dark': '#2e3314',
                        'mc-black': '#121212', // Matte Black
                        'mc-gray': '#1e1e1e',
                        'mc-orange': '#ff8c00', // Detail Orange
                        'mc-gold': '#ffd700', // Detail Gold
                    },
                    fontFamily: {
                        'military': ['"Black Ops One"', 'cursive'],
                        'body': ['"Roboto Condensed"', 'sans-serif'],
                    },
                    backgroundImage: {
                        'textured': "url('../images/textured.png')", // Placeholder for texture if needed
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-mc-black text-gray-200 font-body h-full overflow-hidden select-none">

    <main id="app-container"
        class="h-full flex flex-col relative w-full max-w-lg mx-auto bg-mc-gray shadow-2xl border-x border-mc-green-dark/30">

        <!-- Header & Progress -->
        <header class="relative z-20 bg-mc-black p-4 border-b border-mc-green shadow-md">
            <div class="flex justify-between items-center mb-2">
                <span class="text-mc-gold font-military text-lg">COMUNICAÇÃO DE VIAGEM</span>
                <span id="step-indicator" class="text-xs text-mc-orange font-bold">0%</span>
            </div>
            <div class="w-full bg-gray-800 rounded-full h-2.5 overflow-hidden border border-gray-700">
                <div id="progress-bar" class="bg-mc-green h-2.5 rounded-full transition-all duration-500 ease-out"
                    style="width: 0%"></div>
            </div>
        </header>

        <!-- Form Steps Area -->
        <div id="form-container"
            class="flex-1 relative overflow-hidden p-6 flex flex-col justify-start pt-10 md:justify-center md:pt-0">
            <!-- Dynamic Steps will be injected here -->
        </div>

    </main>

    <!-- Result Modal / Screen -->
    <div id="result-screen" class="hidden fixed inset-0 z-40 bg-mc-black flex flex-col">
        <div class="p-4 border-b border-mc-green bg-mc-black flex justify-between items-center">
            <div class="flex items-center gap-2">
                <a href="index.html"
                    class="text-mc-orange text-xs border border-mc-orange/60 px-2 py-1 rounded hover:bg-mc-orange hover:text-white transition font-bold">
                    ← MENU
                </a>
                <h2 class="text-lg sm:text-2xl font-military text-mc-gold">FICHA DE VIAGEM GERADA</h2>
            </div>
            <button id="restart-btn-top"
                class="text-mc-orange text-sm border border-mc-orange px-2 py-1 rounded hover:bg-mc-orange hover:text-black transition">NOVO</button>
        </div>

        <div class="flex-1 p-6 overflow-y-auto bg-mc-gray flex flex-col items-center">
            <div class="w-full max-w-md">
                <p class="text-gray-400 text-sm mb-2 text-center">Pré-visualização do texto formatado:</p>
                <textarea id="final-output" readonly
                    class="w-full h-64 bg-black text-green-400 font-mono text-sm p-4 rounded border border-mc-green focus:outline-none resize-none shadow-inner mb-4"></textarea>

                <button id="copy-btn"
                    class="w-full py-4 bg-mc-gold text-black font-black text-xl rounded shadow-[0_0_20px_rgba(255,215,0,0.4)] hover:bg-yellow-400 transition transform active:scale-95 flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                    </svg>
                    COPIAR FICHA DE VIAGEM
                </button>

                <div id="copy-feedback" class="mt-2 text-center text-mc-green font-bold opacity-0 transition-opacity">
                    Texto copiado com sucesso!
                </div>

                <div class="mt-8 pt-6 border-t border-gray-700 text-center flex flex-col items-center gap-3">
                    <button id="restart-btn-bottom"
                        class="px-6 py-2 text-gray-400 hover:text-white transition underline">
                        Reiniciar e criar nova ficha
                    </button>
                    <a href="index.html"
                        class="px-6 py-2 text-mc-gold hover:text-yellow-400 transition text-sm font-bold">
                        Voltar ao Menu Principal
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Configuration ---
            const steps = [
                {
                    id: 'nome_colete',
                    label: 'Nome de Colete',
                    type: 'text',
                    placeholder: 'Digite seu nome de colete...',
                    required: true,
                    emoji: '💀'
                },
                {
                    id: 'divisao',
                    label: 'Divisão',
                    type: 'text',
                    placeholder: 'Ex: Leste',
                    required: true,
                    emoji: '📍'
                },
                {
                    id: 'regional',
                    label: 'Regional',
                    type: 'text',
                    placeholder: 'Ex: Jundiaí - I',
                    required: true,
                    emoji: '🗺️'
                },
                {
                    id: 'tel_emergencia',
                    label: 'Tel. Emergência',
                    type: 'tel',
                    placeholder: 'Ex: (11) 99999-9999',
                    required: true,
                    emoji: '📞'
                },
                {
                    id: 'nome_contato',
                    label: 'Nome do Contato',
                    type: 'text',
                    placeholder: 'Ex: Júlia',
                    required: true,
                    emoji: '👤'
                },
                {
                    id: 'cidade_origem',
                    label: 'Cidade de Origem',
                    type: 'text',
                    placeholder: 'Ex: Jundiaí-SP',
                    required: true,
                    emoji: '🏁'
                },
                {
                    id: 'cidade_destino',
                    label: 'Cidade de Destino',
                    type: 'text',
                    placeholder: 'Ex: Florianópolis-SC',
                    required: true,
                    emoji: '🎯'
                },
                {
                    id: 'parada_1',
                    label: '1ª Cidade de Parada (Opcional)',
                    type: 'text',
                    placeholder: 'Ex: Curitiba-PR (opcional)',
                    required: false,
                    emoji: '🛑'
                },
                {
                    id: 'parada_2',
                    label: '2ª Cidade de Parada (Opcional)',
                    type: 'text',
                    placeholder: 'Ex: Joinville-SC (opcional)',
                    required: false,
                    emoji: '🛑'
                },
                {
                    id: 'trajeto',
                    label: 'Trajeto Completo / Rota Prevista',
                    type: 'textarea',
                    placeholder: 'Descreva a rota e rodovias previstas...',
                    required: true,
                    emoji: '🛣️'
                },
                {
                    id: 'data_saida',
                    label: 'Data de Saída',
                    type: 'date',
                    placeholder: 'Selecione a data de saída...',
                    required: true,
                    emoji: '📅'
                },
                {
                    id: 'previsao_retorno',
                    label: 'Previsão de Retorno',
                    type: 'date',
                    placeholder: 'Selecione a previsão de retorno...',
                    required: true,
                    emoji: '📅'
                },
                {
                    id: 'viajando_de',
                    label: 'Está Viajando De:',
                    type: 'select',
                    options: ['MOTO', 'CARRO', 'OUTROS (AVIÃO)', 'OUTROS (ÔNIBUS)', 'OUTROS'],
                    required: true,
                    emoji: '🏍️'
                },
                {
                    id: 'acompanhado',
                    label: 'Acompanhado',
                    type: 'text',
                    placeholder: 'Ex: Com a esposa, Sozinho, etc.',
                    required: true,
                    emoji: '👥'
                },
                {
                    id: 'com_cores',
                    label: 'Com as Cores',
                    type: 'select',
                    options: ['SIM', 'NÃO'],
                    required: true,
                    emoji: '🎖️'
                },
                {
                    id: 'avisarei_chegada',
                    label: 'Avisarei Quando Chegar Em:',
                    type: 'text',
                    placeholder: 'Ex: Destino ou Parada',
                    required: true,
                    emoji: '📢'
                }
            ];

            // --- State ---
            let currentStepIndex = 0;
            const formData = {};

            // --- DOM Elements ---
            const splashScreen = document.getElementById('splash-screen');
            const startBtn = document.getElementById('start-btn');
            const appContainer = document.getElementById('app-container');
            const formContainer = document.getElementById('form-container');
            const progressBar = document.getElementById('progress-bar');
            const stepIndicator = document.getElementById('step-indicator');
            // Nav buttons are now dynamic
            const resultScreen = document.getElementById('result-screen');
            const finalOutput = document.getElementById('final-output');
            const copyBtn = document.getElementById('copy-btn');
            const copyFeedback = document.getElementById('copy-feedback');
            const restartBtnTop = document.getElementById('restart-btn-top');
            const restartBtnBottom = document.getElementById('restart-btn-bottom');

            // --- Initialization ---
            // Set default date to now (YYYY-MM-DDTHH:MM)
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            const defaultDateTime = now.toISOString().slice(0, 16);

            // --- Event Listeners ---
            // Abrir diretamente no formulario (Passo 1)
            renderStep(currentStepIndex);

            if (startBtn) {
                startBtn.addEventListener('click', () => {
                    renderStep(currentStepIndex);
                });
            }



            // nextBtn and prevBtn listeners removed (dynamic now)

            // Allow Enter key to simple inputs to trigger next
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey && !appContainer.classList.contains('hidden') && resultScreen.classList.contains('hidden')) {
                    // Only if not textarea
                    const currentInput = document.querySelector('input:focus');
                    if (currentInput) handleNext();
                }
            });

            copyBtn.addEventListener('click', copyToClipboard);
            [restartBtnTop, restartBtnBottom].forEach(btn => btn.addEventListener('click', resetForm));


            // --- Core Functions ---

            function updateProgress() {
                const percent = Math.round(((currentStepIndex) / steps.length) * 100);
                progressBar.style.width = `${percent}%`;
                stepIndicator.innerText = `${percent}%`;
            }

            function renderStep(index, direction = 'forward') {
                // Clear container
                formContainer.innerHTML = '';

                const step = steps[index];
                const prevData = formData[step.id] || '';

                // Create elements
                const wrapper = document.createElement('div');
                wrapper.className = direction === 'forward' ? 'slide-in-right' : 'slide-in-left'; // Animation class

                const label = document.createElement('label');
                label.className = 'block text-mc-gold text-2xl font-military mb-4';
                label.innerHTML = `${step.emoji} ${step.label}`;

                let input;

                if (step.type === 'date') {
                    input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'w-full p-4 text-lg rounded bg-black border-2 border-mc-green text-gray-200 focus:border-mc-orange focus:outline-none transition-colors rustic-input cursor-pointer';
                    input.placeholder = step.placeholder || "Selecione a data...";
                    if (prevData) {
                        input.value = prevData;
                    } else {
                        const d = new Date();
                        input.value = `${d.getDate().toString().padStart(2, '0')}/${(d.getMonth() + 1).toString().padStart(2, '0')}/${d.getFullYear()}`;
                    }

                    setTimeout(() => {
                        flatpickr(input, {
                            dateFormat: "d/m/Y",
                            defaultDate: prevData || new Date(),
                            locale: "pt",
                            theme: "dark",
                            disableMobile: "true",
                            onChange: function (selectedDates, dateStr, instance) {
                                input.value = dateStr;
                            }
                        });
                    }, 50);

                } else if (step.type === 'time') {
                    input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'w-full p-4 text-lg rounded bg-black border-2 border-mc-green text-gray-200 focus:border-mc-orange focus:outline-none transition-colors rustic-input cursor-pointer';
                    input.placeholder = step.placeholder || "Selecione o horário...";
                    if (prevData) input.value = prevData;

                    setTimeout(() => {
                        flatpickr(input, {
                            enableTime: true,
                            noCalendar: true,
                            dateFormat: "H:i",
                            time_24hr: true,
                            defaultDate: prevData || new Date(),
                            locale: "pt",
                            theme: "dark",
                            disableMobile: "true",
                            onChange: function (selectedDates, dateStr, instance) {
                                input.value = dateStr;
                            }
                        });
                    }, 50);

                } else if (step.type === 'datetime-local') {

                } else if (step.type === 'select') {
                    input = document.createElement('select');
                    input.className = 'w-full p-4 text-lg rounded bg-black border-2 border-mc-green text-gray-200 focus:border-mc-orange focus:outline-none transition-colors rustic-input';

                    // Add default placeholder option
                    const defaultOpt = document.createElement('option');
                    defaultOpt.value = "";
                    defaultOpt.text = "Selecione...";
                    defaultOpt.disabled = true;
                    defaultOpt.selected = !prevData;
                    input.appendChild(defaultOpt);

                    step.options.forEach(opt => {
                        const option = document.createElement('option');
                        option.value = opt;
                        option.text = opt;
                        if (opt === prevData) option.selected = true;
                        input.appendChild(option);
                    });

                } else if (step.type === 'textarea') {
                    input = document.createElement('textarea');
                    input.className = 'w-full p-4 h-32 text-lg rounded bg-black border-2 border-mc-green text-gray-200 focus:border-mc-orange focus:outline-none transition-colors rustic-input resize-none';
                    input.placeholder = step.placeholder;
                    input.value = prevData;

                } else {
                    input = document.createElement('input');
                    input.type = step.type;
                    input.className = 'w-full p-4 text-lg rounded bg-black border-2 border-mc-green text-gray-200 focus:border-mc-orange focus:outline-none transition-colors rustic-input';
                    input.placeholder = step.placeholder;
                    input.value = prevData;

                }

                input.id = 'current-input';

                // Validation helper
                const errorMsg = document.createElement('div');
                errorMsg.id = 'error-msg';
                errorMsg.className = 'text-red-500 text-sm mt-2 opacity-0 transition-opacity font-bold';
                errorMsg.innerText = 'Este campo é obrigatório.';

                wrapper.appendChild(label);
                wrapper.appendChild(input);
                wrapper.appendChild(errorMsg);
                formContainer.appendChild(wrapper);

                // Focus input
                setTimeout(() => input.focus(), 100);

                // --- Buttons Section (Dynamic) ---
                const btnContainer = document.createElement('div');
                btnContainer.className = 'mt-8 flex justify-between gap-4';

                const btnPrev = document.createElement('button');
                btnPrev.innerHTML = 'VOLTAR';
                btnPrev.className = 'flex-1 px-4 py-3 bg-gray-800 text-gray-300 font-bold rounded border border-gray-600 hover:bg-gray-700 transition disabled:opacity-50 disabled:cursor-not-allowed';
                btnPrev.disabled = index === 0;
                btnPrev.onclick = handlePrev;

                const btnNext = document.createElement('button');
                btnNext.innerHTML = index === steps.length - 1 ? 'FINALIZAR' : 'PRÓXIMO';
                btnNext.className = 'flex-1 px-4 py-3 bg-mc-green text-white font-bold rounded border border-mc-gold hover:bg-mc-green-dark shadow-lg shadow-mc-green/20 transition';
                btnNext.onclick = handleNext;

                btnContainer.appendChild(btnPrev);
                btnContainer.appendChild(btnNext);
                wrapper.appendChild(btnContainer);

                // --- Menu Button (Below Voltar / Próximo) ---
                const menuContainer = document.createElement('div');
                menuContainer.className = 'mt-5 text-center';

                const btnMenu = document.createElement('button');
                btnMenu.type = 'button';
                btnMenu.innerHTML = '← MENU';
                btnMenu.className = 'px-6 py-2 bg-black/60 hover:bg-black text-mc-orange hover:text-white text-xs font-bold rounded border border-mc-orange/60 hover:border-mc-orange transition tracking-widest uppercase cursor-pointer';
                btnMenu.onclick = () => {
                    window.location.href = 'index.html';
                };

                menuContainer.appendChild(btnMenu);
                wrapper.appendChild(menuContainer);

                updateProgress();
            }

            function validateCurrentStep() {
                const step = steps[currentStepIndex];
                const input = document.getElementById('current-input');
                const val = input.value.trim();
                const errorMsg = document.getElementById('error-msg');

                if (step.required && !val) {
                    input.classList.add('border-red-500');
                    if (errorMsg) errorMsg.classList.remove('opacity-0');
                    // Shake animation
                    input.classList.add('animate-pulse');
                    setTimeout(() => input.classList.remove('animate-pulse'), 500);
                    return false;
                }

                input.classList.remove('border-red-500');
                if (errorMsg) errorMsg.classList.add('opacity-0');

                // Save data
                formData[step.id] = val;
                return true;
            }

            function handleNext() {
                if (!validateCurrentStep()) return;

                if (currentStepIndex < steps.length - 1) {
                    currentStepIndex++;
                    renderStep(currentStepIndex, 'forward');
                } else {
                    generateReport();
                }
            }

            function handlePrev() {
                if (currentStepIndex > 0) {
                    currentStepIndex--;
                    renderStep(currentStepIndex, 'backward');
                }
            }

            function generateReport() {
                const p1 = formData.parada_1 && formData.parada_1.trim() ? formData.parada_1.trim() : 'NÃO CONSTA';
                const p2 = formData.parada_2 && formData.parada_2.trim() ? formData.parada_2.trim() : 'NÃO CONSTA';

                const report = `
💀 *FICHA DE COMUNICAÇÃO DE VIAGEM* 💀

*NOME DE COLETE:* ${formData.nome_colete}

*DIVISÃO:* ${formData.divisao}

*REGIONAL:* ${formData.regional}

*TEL. EMERGÊNCIA:* ${formData.tel_emergencia}

*NOME DO CONTATO:* ${formData.nome_contato}

*CIDADE DE ORIGEM:* ${formData.cidade_origem}

*CIDADE DE DESTINO:* ${formData.cidade_destino}

*1ª CIDADE DE PARADA:* ${p1}

*2ª CIDADE DE PARADA:* ${p2}

*TRAJETO COMPLETO / ROTA PREVISTA:*
${formData.trajeto}

*DATA DE SAÍDA:* ${formData.data_saida}

*PREVISÃO DE RETORNO:* ${formData.previsao_retorno}

*ESTÁ VIAJANDO DE:* ${formData.viajando_de}

*ACOMPANHADO:* ${formData.acompanhado}

*COM AS CORES:* ${formData.com_cores}

*AVISAREI QUANDO CHEGAR EM:* ${formData.avisarei_chegada}
`;

                finalOutput.value = report.trim().toUpperCase();

                // Show result screen
                appContainer.classList.add('hidden');
                resultScreen.classList.remove('hidden');
            }

            function copyToClipboard() {
                finalOutput.select();
                finalOutput.setSelectionRange(0, 99999); // Mobile

                // Try the modern API first
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(finalOutput.value)
                        .then(showCopyFeedback)
                        .catch(err => {
                            console.error('Clipboard API failed', err);
                            fallbackCopy();
                        });
                } else {
                    fallbackCopy();
                }
            }

            function fallbackCopy() {
                try {
                    document.execCommand('copy');
                    showCopyFeedback();
                } catch (err) {
                    console.error('Fallback copy failed', err);
                    alert('Não foi possível copiar automaticamente. Por favor, copie manualmente.');
                }
            }

            function showCopyFeedback() {
                copyFeedback.classList.remove('opacity-0');
                copyBtn.classList.remove('bg-mc-gold');
                copyBtn.classList.add('bg-green-500');
                copyBtn.innerHTML = 'COPIADO!';

                setTimeout(() => {
                    copyFeedback.classList.add('opacity-0');
                    copyBtn.classList.add('bg-mc-gold');
                    copyBtn.classList.remove('bg-green-500');
                    copyBtn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                </svg> COPIAR FICHA DE VIAGEM
            `;
                }, 3000);
            }

            function resetForm() {
                // Clear data
                for (const key in formData) delete formData[key];
                currentStepIndex = 0;

                // UI Reset
                resultScreen.classList.add('hidden');
                appContainer.classList.remove('hidden');

                // Reset progress
                progressBar.style.width = '0%';
                stepIndicator.innerText = '0%';

                renderStep(0);
            }
        });

    </script>
</body>

</html>
